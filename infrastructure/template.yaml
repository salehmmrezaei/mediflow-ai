
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: MediFlow AI serverless backend with DynamoDB and Cognito

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Unique Cognito domain prefix for the doctor hosted login page
    MinLength: 1
    MaxLength: 63
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

Resources:

  # ----------------------------------------
  # 1. Public Health Check Lambda
  # ----------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: health/
      Handler: handler.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET

  # ----------------------------------------
  # 2. DynamoDB Patients Table
  # ----------------------------------------
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH

  # ----------------------------------------
  # 3. Patient API Lambda (FastAPI + Mangum)
  # ----------------------------------------
  PatientApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 15

      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable

      Events:
        ListPatients:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientsHttpApi
            Path: /patients
            Method: GET

        GetPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientsHttpApi
            Path: /patients/{patient_id}
            Method: GET

        CreatePatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientsHttpApi
            Path: /patients
            Method: POST

  # ----------------------------------------
  # 4. Cognito User Pool for Doctors
  # ----------------------------------------
  DoctorsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: mediflow-doctors-dev
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  # ----------------------------------------
  # 5. Cognito Application Client
  # ----------------------------------------
  DoctorsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref DoctorsUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:5173/
      LogoutURLs:
        - http://localhost:5173/

  DoctorsUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref DoctorsUserPool
      ManagedLoginVersion: 1

  # ----------------------------------------
  # 6. Secure Patient HTTP API
  # ----------------------------------------
  PatientsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${DoctorsUserPool}"
              audience:
                - !Ref DoctorsUserPoolClient

# ----------------------------------------
# CloudFormation Outputs
# ----------------------------------------
Outputs:

  PatientApiUrl:
    Description: Secure Patient API endpoint
    Value: !Sub "https://${PatientsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UserPoolId:
    Description: Cognito doctor User Pool ID
    Value: !Ref DoctorsUserPool

  UserPoolClientId:
    Description: Cognito application Client ID
    Value: !Ref DoctorsUserPoolClient

  CognitoDomain:
    Description: Cognito hosted login domain (without the https scheme)
    Value: !Sub "${DoctorsUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
