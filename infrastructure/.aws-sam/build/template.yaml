AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MediFlow AI serverless API
Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HealthFunction
      Handler: handler.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
    Metadata:
      SamResourceId: HealthFunction
